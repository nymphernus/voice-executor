# Пример конфигурации голосового ассистента.
# Скопируйте этот файл в config.toml и настройте под себя.

[recognition]
# Путь к модели Vosk
model_path = "models/vosk-model-small-ru-0.22"
# Частота дискретизации
sample_rate = 16000
# Размер чанка аудио
chunk_size = 4000
# Устройство ввода ("default" или индекс)
device = "default"

[commands]
# Триггеры для завершения работы
stop = ["завершить", "стоп", "хватит"]
# Триггеры для переключения микрофона в Discord
discord = ["микрофон", "микро"]
# Триггеры для запуска Dota 2
dota = ["дота"]
# Триггеры для запуска PHPStorm
phpstorm = ["шторм", "storm"]
# Триггеры для открытия YouTube
youtube = ["ютуб", "youtube"]
# Триггеры для обновления страницы (F5)
refresh = ["обновить", "обнови"]
# Триггеры для открытия диспетчера задач
taskmanager = ["диспетчер"]
# Триггеры для открытия терминала
terminal = ["терминал"]
# Триггеры для скриншота
screenshot = ["скриншот"]
# Триггеры для таймера
timer = ["таймер"]

# Максимальное количество слов в команде (защита от ложных срабатываний)
max_command_words = 2
